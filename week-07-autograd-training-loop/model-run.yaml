notes: >-
  No language model and no high-level PyTorch training helpers. Week 7 rewrites
  the Week 6 loop by hand: requires_grad tensors, a manual forward, backward(), a
  hand-written optimizer step inside torch.no_grad(), and explicit gradient
  clearing. The first two gradients agree in this run's raw JSON. The forward
  rule and update match the mathematics of Week 6's plain SGD, not a promise of
  bitwise identity across implementations or environments. A fresh process
  loaded the checkpoint with weights_only=True and predicted 25 C under no_grad.
